<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel Admin</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#1a1a1a;
      color:white;

      font-family:Arial, sans-serif;

      padding:40px;
    }

    h1{
      margin-bottom:30px;
      color:#2bbfaa;
    }

    h2, h3{
      margin-top:35px;
      margin-bottom:15px;
    }

    .box{
      background:#2a2a2a;

      padding:20px;

      border-radius:10px;

      margin-bottom:20px;

      max-width:600px;
    }

    input,
    textarea{
      width:100%;

      padding:12px;

      border:none;
      border-radius:8px;

      background:#1f1f1f;
      color:white;

      margin-bottom:12px;

      font-size:15px;
    }

    textarea{
      resize:none;
      min-height:120px;
    }

    button{
      background:#2bbfaa;
      color:white;

      border:none;
      border-radius:8px;

      padding:12px 20px;

      cursor:pointer;

      font-weight:bold;

      transition:0.2s;
    }

    button:hover{
      background:#23a896;
    }

  </style>

</head>

<body>

  <h1>Painel do Admin</h1>

  <!-- POSTS -->
  <div class="box">

    <h2>Criar Aviso</h2>

    <input 
      type="text" 
      id="titulo" 
      placeholder="Título do aviso"
    >

    <textarea 
      id="conteudo" 
      placeholder="Escreva o aviso"
    ></textarea>

    <button onclick="postar()">
      Publicar Aviso
    </button>

  </div>

  <!-- VERSÍCULO -->
  <div class="box">

    <h2>Versículo da Semana</h2>

    <input 
      type="text" 
      id="referencia" 
      placeholder="Referência (Ex: João 3:16)"
    >

    <textarea 
      id="textoVersiculo" 
      placeholder="Digite o versículo"
    ></textarea>

    <button onclick="salvarVersiculo()">
      Salvar Versículo
    </button>

  </div>

  <!-- AGENDA -->
  <div class="box">

    <h2>Agenda</h2>

    <input 
      type="text" 
      id="nomeAgenda" 
      placeholder="Nome do evento"
    >

    <input 
      type="text" 
      id="horarioAgenda" 
      placeholder="Horário"
    >

    <button onclick="salvarAgenda()">
      Salvar Evento
    </button>

    <hr><br>

<h2>Eventos Cadastrados</h2>

<div id="listaAgenda"></div>

  </div>

  <hr><br>

<h2>Avisos Publicados</h2>

<div id="listaPosts"></div>

<script type="module" src="js/admin.js"></script> 

</body>
</html>
